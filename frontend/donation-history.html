
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Donation History | BBMS</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .history-page {
            max-width: 1100px;
            margin: 35px auto;
            padding: 24px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .history-header h1 {
            margin-bottom: 8px;
            color: #b42332;
        }

        .history-header p {
            margin: 0;
            color: #666;
        }

        .history-back {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            background: #b42332;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .history-back:hover {
            background: #8f1724;
        }

        .history-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .history-stat {
            background: white;
            border: 1px solid #f0dfe1;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
        }

        .history-stat span {
            color: #666;
            font-size: 14px;
        }

        .history-stat strong {
            display: block;
            margin-top: 8px;
            color: #b42332;
            font-size: 28px;
        }

        .history-toolbar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 22px;
        }

        .history-toolbar input,
        .history-toolbar select {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 9px;
            background: white;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 18px;
        }

        .donation-card {
            background: white;
            border: 1px solid #eee;
            border-left: 5px solid #b42332;
            border-radius: 13px;
            padding: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
        }

        .donation-card h3 {
            margin: 0 0 8px;
            color: #292929;
        }

        .donation-date {
            color: #777;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .donation-details {
            display: grid;
            gap: 10px;
        }

        .donation-detail {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            font-size: 14px;
        }

        .donation-detail span:first-child {
            color: #666;
        }

        .donation-detail span:last-child {
            text-align: right;
            overflow-wrap: anywhere;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: capitalize;
        }

        .status-passed {
            background: #e4f7eb;
            color: #187344;
        }

        .status-pending {
            background: #fff2d6;
            color: #8a5a00;
        }

        .status-failed {
            background: #fde8e8;
            color: #b42332;
        }

        .donation-remarks {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            font-size: 13px;
            color: #666;
            overflow-wrap: anywhere;
        }

        .history-message {
            grid-column: 1 / -1;
            padding: 28px;
            text-align: center;
            background: white;
            border-radius: 12px;
            color: #666;
        }

        @media (max-width: 600px) {
            .history-page {
                margin: 12px auto;
                padding: 14px;
            }

            .history-header {
                align-items: stretch;
            }

            .history-back {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="container history-page">
        <header class="history-header">
            <div>
                <h1>🩸 My Donation History</h1>
                <p>Track your previous blood donations and screening status.</p>
            </div>

            <button
                class="history-back"
                type="button"
                onclick="window.location.href='role-dashboard.html'">
                ← Back to Dashboard
            </button>
        </header>

        <section class="history-summary">
            <article class="history-stat">
                <span>Total Donations</span>
                <strong id="historyTotalDonations">—</strong>
            </article>

            <article class="history-stat">
                <span>Total Units Recorded</span>
                <strong id="historyTotalUnits">—</strong>
            </article>

            <article class="history-stat">
                <span>Screening Passed</span>
                <strong id="historyPassed">—</strong>
            </article>
        </section>

        <section class="history-toolbar">
            <input
                type="search"
                id="historySearch"
                placeholder="Search blood group or remarks..."
                aria-label="Search donation history">

            <select id="historyBloodGroup" aria-label="Filter blood group">
                <option value="">All Blood Groups</option>
                <option value="A+">A+</option>
                <option value="A-">A−</option>
                <option value="B+">B+</option>
                <option value="B-">B−</option>
                <option value="O+">O+</option>
                <option value="O-">O−</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB−</option>
            </select>

            <select id="historyComponent" aria-label="Filter component">
                <option value="">All Components</option>
                <option value="Whole Blood">Whole Blood</option>
                <option value="Plasma">Plasma</option>
                <option value="Platelets">Platelets</option>
            </select>

            <select id="historyStatus" aria-label="Filter health check status">
                <option value="">All Screening Statuses</option>
                <option value="passed">Passed</option>
                <option value="pending">Pending</option>
                <option value="failed">Failed</option>
            </select>
        </section>

        <section id="donationHistory" class="history-list" aria-live="polite">
            <div class="history-message">Loading donation history...</div>
        </section>
    </main>

    <script src="js/donation-history.js"></script>
</body>
</html>
