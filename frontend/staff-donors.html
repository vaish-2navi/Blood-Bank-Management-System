<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donor Management - BBMS</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<!-- ================================
     HEADER
================================ -->

<header class="header">

    <div class="logo">
        🩸 <span>BloodBank</span>
    </div>

    <div class="notification">
        🔔
    </div>

</header>



<!-- ================================
     MAIN CONTENT
================================ -->

<main class="container">


    <!-- PAGE INTRODUCTION -->

    <section class="welcome">

        <p class="small-text">
            Staff Panel
        </p>

        <h1>
            Donor Management
        </h1>

        <p>
            View and manage registered donor information.
        </p>

    </section>



    <!-- ================================
         SEARCH & FILTER
    ================================= -->

    <section>

        <div class="stock-filters">

            <div class="search-box">

                <input
                    type="text"
                    id="donorSearch"
                    placeholder="🔍 Search donor name, email or phone..."
                >

            </div>


            <div class="filter-row">

                <select id="donorBloodGroupFilter">

                    <option value="">
                        All Blood Groups
                    </option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>

                </select>


                <button
                    type="button"
                    id="clearDonorFilters"
                >
                    Clear
                </button>

            </div>

        </div>


        <!-- ================================
             DONOR COUNT
        ================================= -->

        <div class="section-title">

            <h2>
                Registered Donors
            </h2>

        </div>


        <p
            id="donorCount"
            class="small-text"
        >
            Loading donors...
        </p>



        <!-- ================================
             DONOR LIST
        ================================= -->

        <div
            class="stock-table-container"
            id="donorTableContainer"
        >

            <p>
                Loading donor records...
            </p>

        </div>

    </section>


</main>

     BOTTOM NAVIGATION
================================ -->

</nav>

</body>
