<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Patient Profile - BBMS</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* ================================
           PATIENT PROFILE PAGE
        ================================= */

        body {
            background: #f7f8fa;
        }

        .patient-profile-page {
            min-height: 100vh;
            padding-bottom: 90px;
        }


        /* ================================
           HEADER
        ================================= */

        .patient-profile-header {

            display: flex;
            align-items: center;
            gap: 14px;

            padding: 18px 22px;

            background: #ffffff;

            border-bottom: 1px solid #eeeeee;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .patient-profile-header-icon {

            width: 42px;
            height: 42px;

            border-radius: 12px;

            background: #fff0f0;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        .patient-profile-header-text {
            flex: 1;
        }

        .patient-profile-header-text h2 {

            margin: 0;

            font-size: 20px;

            color: #222;
        }

        .patient-profile-header-text p {

            margin: 3px 0 0;

            font-size: 12px;

            color: #888;
        }

        .patient-profile-notification {

            width: 40px;
            height: 40px;

            border-radius: 50%;

            background: #fff0f0;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            font-size: 18px;
        }


        /* ================================
           MAIN CONTAINER
        ================================= */

        .patient-profile-container {

            max-width: 850px;

            margin: 0 auto;

            padding: 25px 20px 30px;
        }


        /* ================================
           PROFILE INTRO
        ================================= */

        .patient-profile-intro {

            background: linear-gradient(
                135deg,
                #d71920,
                #ef5350
            );

            color: white;

            border-radius: 22px;

            padding: 25px;

            display: flex;

            align-items: center;

            gap: 18px;

            margin-bottom: 28px;

            box-shadow:
                0 8px 25px rgba(215, 25, 32, 0.20);
        }

        .patient-profile-avatar {

            width: 70px;
            height: 70px;

            flex-shrink: 0;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.20);

            border: 2px solid rgba(255, 255, 255, 0.5);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;
        }

        .patient-profile-intro h1 {

            margin: 0 0 5px;

            font-size: 22px;
        }

        .patient-profile-intro p {

            margin: 0 0 9px;

            font-size: 13px;

            opacity: 0.9;
        }

        .patient-role-badge {

            display: inline-block;

            padding: 5px 11px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.18);

            border: 1px solid rgba(255, 255, 255, 0.35);

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 0.5px;
        }


        /* ================================
           SECTION
        ================================= */

        .patient-profile-section {

            margin-bottom: 22px;
        }

        .patient-section-heading {

            margin-bottom: 12px;
        }

        .patient-section-heading h2 {

            margin: 0;

            font-size: 19px;

            color: #222;
        }

        .patient-section-heading p {

            margin: 5px 0 0;

            font-size: 13px;

            color: #888;
        }


        /* ================================
           PROFILE CARD
        ================================= */

        .patient-profile-card,
        .patient-account-card {

            background: #ffffff;

            border-radius: 20px;

            padding: 26px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.07);
        }


        /* ================================
           FORM
        ================================= */

        .patient-form-group {

            margin-bottom: 18px;
        }

        .patient-form-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

            color: #333;
        }

        .patient-form-group input,
        .patient-form-group select,
        .patient-form-group textarea {

            width: 100%;

            box-sizing: border-box;

            border: 1px solid #dddddd;

            border-radius: 12px;

            padding: 12px 14px;

            background: #fafafa;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }

        .patient-form-group input:focus,
        .patient-form-group select:focus,
        .patient-form-group textarea:focus {

            border-color: #d71920;

            background: #ffffff;

            box-shadow:
                0 0 0 3px rgba(215, 25, 32, 0.08);
        }

        .patient-form-group textarea {

            resize: vertical;

            min-height: 95px;
        }


        /* ================================
           SAVE BUTTON
        ================================= */

        .patient-form-actions {

            margin-top: 5px;
        }

        .patient-save-button {

            width: 100%;

            border: none;

            border-radius: 13px;

            padding: 14px;

            background: #d71920;

            color: #ffffff;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .patient-save-button:hover {

            background: #b9151b;

            transform: translateY(-1px);
        }

        .patient-save-button:active {

            transform: translateY(0);
        }


        /* ================================
           MESSAGE
        ================================= */

        .patient-profile-message {

            text-align: center;

            margin-top: 12px;

            font-size: 13px;

            min-height: 20px;
        }


        /* ================================
           ACCOUNT INFORMATION
        ================================= */

        .patient-account-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 15px 0;

            border-bottom: 1px solid #eeeeee;
        }

        .patient-account-row:first-child {
            padding-top: 0;
        }

        .patient-account-row:last-child {

            border-bottom: none;

            padding-bottom: 0;
        }

        .patient-account-row span {

            color: #777;

            font-size: 14px;
        }

        .patient-account-row strong {

            color: #222;

            font-size: 14px;

            text-align: right;

            word-break: break-word;
        }


        /* ================================
           BOTTOM NAV
        ================================= */

        .bottom-nav {

            position: fixed;

            bottom: 0;
            left: 0;
            right: 0;

            height: 68px;

            background: #ffffff;

            border-top: 1px solid #eeeeee;

            display: flex;

            justify-content: space-around;

            align-items: center;

            z-index: 200;

            box-shadow:
                0 -3px 15px rgba(0, 0, 0, 0.06);
        }

        .bottom-nav .nav-item {

            text-decoration: none;

            color: #777;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 3px;

            font-size: 18px;

            min-width: 60px;
        }

        .bottom-nav .nav-item small {

            font-size: 10px;
        }

        .bottom-nav .nav-item.active {

            color: #d71920;

            font-weight: 600;
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .patient-profile-header {

                padding: 15px;
            }

            .patient-profile-container {

                padding: 18px 14px 25px;
            }

            .patient-profile-intro {

                padding: 20px;

                border-radius: 18px;
            }

            .patient-profile-avatar {

                width: 58px;
                height: 58px;

                font-size: 27px;
            }

            .patient-profile-intro h1 {

                font-size: 19px;
            }

            .patient-profile-card,
            .patient-account-card {

                padding: 20px 16px;

                border-radius: 17px;
            }

            .patient-account-row {

                align-items: flex-start;

                flex-direction: column;

                gap: 5px;
            }

            .patient-account-row strong {

                text-align: left;
            }

            .bottom-nav {

                height: 64px;
            }
        }

    </style>

</head>


<body class="patient-profile-page">


<!-- ================================
     HEADER
================================= -->

<header class="patient-profile-header">

    <div class="patient-profile-header-icon">
        👤
    </div>

    <div class="patient-profile-header-text">

        <h2>
            Patient Profile
        </h2>

        <p>
            Manage your personal information
        </p>

    </div>

    <a
        href="notifications.html"
        class="patient-profile-notification"
    >
        🔔
    </a>

</header>



<!-- ================================
     MAIN
================================= -->

<main class="patient-profile-container">


    <!-- ================================
         PROFILE INTRO
    ================================= -->

    <section class="patient-profile-intro">

        <div class="patient-profile-avatar">
            👤
        </div>

        <div>

            <h1 id="patientName">
                Patient
            </h1>

            <p id="patientEmail">
                Loading...
            </p>

            <span class="patient-role-badge">
                PATIENT
            </span>

        </div>

    </section>



    <!-- ================================
         PERSONAL INFORMATION
    ================================= -->

    <section class="patient-profile-section">

        <div class="patient-section-heading">

            <h2>
                Personal Information
            </h2>

            <p>
                Enter and update your personal details.
            </p>

        </div>


        <div class="patient-profile-card">

            <form id="patientProfileForm">


                <!-- Blood Group -->

                <div class="patient-form-group">

                    <label for="patientBloodGroup">
                        Blood Group *
                    </label>

                    <select
                        id="patientBloodGroup"
                        required
                    >

                        <option value="">
                            Select Blood Group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A−</option>
                        <option value="B+">B+</option>
                        <option value="B-">B−</option>
                        <option value="O+">O+</option>
                        <option value="O-">O−</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB−</option>

                    </select>

                </div>



                <!-- Date of Birth -->

                <div class="patient-form-group">

                    <label for="patientDateOfBirth">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="patientDateOfBirth"
                    >

                </div>



                <!-- Gender -->

                <div class="patient-form-group">

                    <label for="patientGender">
                        Gender
                    </label>

                    <select
                        id="patientGender"
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>



                <!-- Address -->

                <div class="patient-form-group">

                    <label for="patientAddress">
                        Address
                    </label>

                    <textarea
                        id="patientAddress"
                        rows="4"
                        placeholder="Enter your complete address"
                    ></textarea>

                </div>



                <!-- Medical Condition -->

                <div class="patient-form-group">

                    <label for="patientMedicalCondition">
                        Medical Condition
                    </label>

                    <textarea
                        id="patientMedicalCondition"
                        rows="4"
                        placeholder="Enter medical condition, allergies, or other relevant information"
                    ></textarea>

                </div>



                <!-- Save -->

                <div class="patient-form-actions">

                    <button
                        type="submit"
                        class="patient-save-button"
                    >
                        💾 Save Patient Profile
                    </button>

                </div>



                <!-- Message -->

                <div
                    id="patientProfileMessage"
                    class="patient-profile-message"
                ></div>


            </form>

        </div>

    </section>



    <!-- ================================
         ACCOUNT INFORMATION
    ================================= -->

    <section class="patient-profile-section">

        <div class="patient-section-heading">

            <h2>
                Account Information
            </h2>

            <p>
                Your registered account details.
            </p>

        </div>


        <div class="patient-account-card">


            <div class="patient-account-row">

                <span>
                    👤 Full Name
                </span>

                <strong id="accountFullName">
                    -
                </strong>

            </div>



            <div class="patient-account-row">

                <span>
                    📧 Email
                </span>

                <strong id="accountEmail">
                    -
                </strong>

            </div>



            <div class="patient-account-row">

                <span>
                    📱 Phone
                </span>

                <strong id="accountPhone">
                    -
                </strong>

            </div>


        </div>

    </section>


</main>



<!-- ================================
     BOTTOM NAVIGATION
================================= -->

<nav class="bottom-nav">


    <a
        href="index.html"
        class="nav-item"
    >

        <span>🏠</span>

        <small>Home</small>

    </a>



    <a
        href="blood-stock.html"
        class="nav-item"
    >

        <span>📦</span>

        <small>Stock</small>

    </a>



    <a
        href="requests.html"
        class="nav-item"
    >

        <span>📋</span>

        <small>Requests</small>

    </a>



    <a
        href="donate.html"
        class="nav-item"
    >

        <span>🩸</span>

        <small>Donate</small>

    </a>



    <a
        href="profile.html"
        class="nav-item active"
    >

        <span>👤</span>

        <small>Profile</small>

    </a>


</nav>



<!-- ================================
     JAVASCRIPT
================================= -->

<script src="js/patient-profile.js"></script>


</body>

</html>
