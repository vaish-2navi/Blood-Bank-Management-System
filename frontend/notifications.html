
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications - BBMS</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .notifications-page {
            background: #f7f8fc;
            color: #252b36;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .notification-wrapper {
            width: min(1100px, 92%);
            margin: 0 auto;
        }

        .notification-header {
            display: flex;
            align-items: center;
            gap: 18px;
            background: linear-gradient(135deg, #b91c35, #e63950);
            color: #fff;
            padding: 28px max(4%, calc((100% - 1100px) / 2));
            border-radius: 0 0 24px 24px;
            box-shadow: 0 6px 20px rgba(185, 28, 53, 0.15);
        }

        .notification-header .header-icon {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            font-size: 27px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 17px;
        }

        .notification-header .header-content h2 {
            margin: 0 0 6px;
            font-size: 27px;
            color: #fff;
        }

        .notification-header .header-content p {
            margin: 0;
            color: #ffe7eb;
            font-size: 14px;
        }

        .notification-summary {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            margin: 28px auto;
            width: min(1100px, 92%);
        }

        .notification-summary-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #fff;
            padding: 22px;
            border: 1px solid #eceef3;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(25, 35, 55, 0.04);
        }

        .summary-icon {
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            border-radius: 15px;
            font-size: 23px;
        }

        .total-icon {
            background: #fff0f2;
        }

        .unread-icon {
            background: #fff1e9;
        }

        .summary-content h3 {
            margin: 0 0 5px;
            font-size: 28px;
            color: #bd233d;
        }

        .summary-content p {
            margin: 0;
            color: #697386;
            font-size: 13px;
        }

        .notification-action-section {
            width: min(1100px, 92%);
            margin: 32px auto 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .notification-action-section h3 {
            margin: 0 0 6px;
            font-size: 21px;
            color: #202633;
        }

        .notification-action-section p {
            margin: 0;
            font-size: 13px;
            color: #788195;
        }

        .notification-actions {
            width: min(1100px, 92%);
            margin: 0 auto 18px;
            display: flex;
            justify-content: flex-end;
        }

        #markAllReadBtn {
            border: none;
            border-radius: 10px;
            padding: 11px 18px;
            background: #c52640;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        #markAllReadBtn:hover {
            background: #a91d34;
            transform: translateY(-1px);
        }

        #markAllReadBtn:disabled {
            background: #d7d9df;
            color: #737987;
            cursor: not-allowed;
            transform: none;
        }

        .notifications-container {
            width: min(1100px, 92%);
            margin: 0 auto;
        }

        #notificationsList {
            display: grid;
            gap: 14px;
        }

        /* Styles for notification elements rendered by JavaScript */
        #notificationsList > * {
            box-sizing: border-box;
            max-width: 100%;
        }

        #notificationsList .notification-card,
        #notificationsList .notification-item {
            background: #fff;
            border: 1px solid #eceef3;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 14px rgba(25, 35, 55, 0.04);
        }

        #notificationsList .unread {
            border-left: 4px solid #cf2944;
            background: #fffafb;
        }

        #notificationsList h3 {
            margin-top: 0;
            color: #252b36;
        }

        #notificationsList p {
            color: #626d80;
            line-height: 1.6;
        }

        .notification-loading,
        .notification-empty,
        .notification-error {
            text-align: center;
            background: #fff;
            padding: 42px 20px;
            border: 1px dashed #dfe3eb;
            border-radius: 18px;
            color: #697386;
        }

        .loading-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        /* Bottom navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 4px;
            padding: 10px 6px calc(10px + env(safe-area-inset-bottom));
            background: #fff;
            border-top: 1px solid #e9eaf0;
            box-shadow: 0 -4px 16px rgba(25, 35, 55, 0.06);
        }

        .bottom-nav a {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 2px;
            text-decoration: none;
            color: #7b8495;
            border-radius: 10px;
        }

        .bottom-nav a span {
            font-size: 20px;
        }

        .bottom-nav a small {
            font-size: 10px;
        }

        .bottom-nav a.active {
            color: #c52640;
            background: #fff0f2;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .notification-header {
                padding: 23px 5%;
                gap: 13px;
            }

            .notification-header .header-icon {
                width: 48px;
                height: 48px;
                font-size: 23px;
            }

            .notification-header .header-content h2 {
                font-size: 22px;
            }

            .notification-summary {
                gap: 10px;
                margin: 20px auto;
            }

            .notification-summary-card {
                padding: 14px 10px;
                gap: 9px;
                border-radius: 14px;
            }

            .summary-icon {
                width: 38px;
                height: 38px;
                font-size: 18px;
                border-radius: 11px;
            }

            .summary-content h3 {
                font-size: 23px;
            }

            .summary-content p {
                font-size: 11px;
                line-height: 1.4;
            }

            .notification-action-section h3 {
                font-size: 19px;
            }

            .notification-actions {
                justify-content: stretch;
            }

            #markAllReadBtn {
                width: 100%;
            }

            #notificationsList .notification-card,
            #notificationsList .notification-item {
                padding: 16px;
            }

            .bottom-nav a small {
                font-size: 9px;
            }
        }
    </style>
</head>

<body class="notifications-page">

    <header class="page-header notification-header">
        <div class="header-icon">🔔</div>

        <div class="header-content">
            <h2>Notifications</h2>
            <p>Stay updated with your blood bank activities</p>
        </div>
    </header>

    <section class="notification-summary">

        <div class="notification-summary-card">
            <div class="summary-icon total-icon">🔔</div>
            <div class="summary-content">
                <h3 id="totalNotifications">0</h3>
                <p>Total Notifications</p>
            </div>
        </div>

        <div class="notification-summary-card">
            <div class="summary-icon unread-icon">🔴</div>
            <div class="summary-content">
                <h3 id="unreadNotifications">0</h3>
                <p>Unread Notifications</p>
            </div>
        </div>

    </section>

    <section class="notification-action-section">
        <div>
            <h3>Recent Notifications</h3>
            <p>Manage your blood bank updates</p>
        </div>
    </section>

    <div class="notification-actions">
        <button
            type="button"
            id="markAllReadBtn"
            onclick="markAllAsRead()">
            ✓ Mark All as Read
        </button>
    </div>

    <main class="notifications-container">
        <div id="notificationsList">
            <div class="notification-loading">
                <div class="loading-icon">🔔</div>
                <p>Loading notifications...</p>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html">
            <span>⌂</span>
            <small>Home</small>
        </a>

        <a href="blood-stock.html">
            <span>🩸</span>
            <small>Blood Stock</small>
        </a>

        <a href="requests.html">
            <span>📋</span>
            <small>Requests</small>
        </a>

        <a href="donate.html">
            <span>💉</span>
            <small>Donate</small>
        </a>

        <a href="notification.html" class="active">
            <span>🔔</span>
            <small>Notifications</small>
        </a>

        <a href="profile.html">
            <span>👤</span>
            <small>Profile</small>
        </a>
    </nav>

    <script src="js/notifications.js"></script>

</body>
</html>
