<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blood Stock - BBMS</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- ================================
     HEADER
================================ -->

<header class="header">

    <div class="logo">
        🩸 <span>BloodBank</span>
    </div>

    <div class="notification">
        🔔
    </div>

</header>



<!-- ================================
     MAIN CONTENT
================================ -->

<main class="container">


    <!-- PAGE INTRODUCTION -->

    <section class="welcome">

        <p class="small-text">
            Blood Inventory
        </p>

        <h1>
            Blood Stock
        </h1>

        <p>
            Check currently available blood units.
        </p>

    </section>



    <!-- ================================
         BLOOD GROUPS
    ================================= -->

    <section>
        <!-- ================================
     SEARCH & FILTER
================================ -->

<div class="stock-filters">

    <div class="search-box">

        <input
            type="text"
            id="stockSearch"
            placeholder="🔍 Search blood group or location..."
        >

    </div>


    <div class="filter-row">

        <!-- Blood Group -->

        <select id="bloodGroupFilter">

            <option value="">All Blood Groups</option>

            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>

        </select>


        <!-- Component -->

        <select id="componentFilter">

            <option value="">All Components</option>

            <option value="Whole Blood">
                Whole Blood
            </option>

            <option value="Plasma">
                Plasma
            </option>

            <option value="Platelets">
                Platelets
            </option>

        </select>


        <!-- Status -->

        <select id="statusFilter">

            <option value="">All Status</option>

            <option value="available">
                Available
            </option>

            <option value="reserved">
                Reserved
            </option>

            <option value="issued">
                Issued
            </option>

            <option value="expired">
                Expired
            </option>

        </select>


        <button
            type="button"
            id="clearFilters"
        >
            Clear
        </button>

    </div>

</div>

        <div class="section-title">

            <h2>
                Available Blood Groups
            </h2>

        </div>


        <!--
            JavaScript will load
            blood stock here
        -->

        <div
            class="blood-grid"
            id="bloodStockGrid"
        >

            <p id="stockLoading">
                Loading blood stock...
            </p>

        </div>
        <div class="section-title stock-details-title">

    <h2>
        Stock Details
    </h2>

</div>

<div
    class="stock-table-container"
    id="stockDetailsContainer"
>

    <p>
        Loading stock details...
    </p>

</div>

    </section>


</main>

     BOTTOM NAVIGATION
================================ -->

    <a

    >

        <span>🏠</span>

        <span>🩸</span>

    <a

        class="nav-item"

        <span>👤</span>

        <small>

    </a>


</nav>

     JAVASCRIPT
================================ -->

<script src="js/blood-stock.js"></script>


</body>

</html>
